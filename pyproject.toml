[project]
name = "agents"
version = "0.1.0"
description = "Antigravity Agent Skills & Automation Repository"
requires-python = ">=3.10"
authors = [
    { name = "Ahmad Nawawi", email = "ahmadmcer@gmail.com" },
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".gemini",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern Python syntax)
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
